name: Diagnostico temporal de publicacion HACERLO
on:
  push:
    branches: [hacerlo-v2-modular]
    paths: ['.github/workflows/diagnostico-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Leer estado GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo 'ESTADO_PAGES'
          gh api "repos/${GH_REPO}/pages" --jq '{status,html_url,build_type,source,public,https_enforced}' || true
          echo 'DESPLIEGUE_BLOQUEANTE'
          gh api "repos/${GH_REPO}/pages/deployments/a3523eacffc25972f9c3e7d8a883217d2a230323" --jq '{status,created_at,updated_at}' || true

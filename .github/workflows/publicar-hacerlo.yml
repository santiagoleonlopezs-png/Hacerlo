name: HACERLO - Publicacion controlada

on:
  push:
    branches:
      - hacerlo-v2-modular
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Publicar solo la version mas reciente: cancela despliegues obsoletos.
concurrency:
  group: hacerlo-pages-produccion
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          set -e
          test -f index.html
          test -f responder.html
          test -f admin/index.html
          test -f admin/analytics.js
          test -f admin/analytics.css
          test -f admin/members.js
          test -f admin/members.css
          node --check admin/analytics.js
          node --check admin/members.js
          node tests/admin_members_v1.cjs
          test -f src/core/app.js
          test -f src/modules/encuestas/encuestas.js
          node --check src/core/app.js
          node --check src/core/iniciativas-home.js
          node --check src/core/centro-inteligencia.js
          node --check src/modules/medicion/paneles.js
          node --check src/modules/implementacion/operaciones.js
          node --check src/modules/implementacion/mecanismos.js
          node tests/implementacion_mecanismos_v1.cjs
          node --check src/modules/implementacion/laboratorio.js
          node --check src/modules/implementacion/laboratorio-recomendaciones.js
          node --check src/modules/implementacion/laboratorio-resultados.js
          node --check src/modules/inteligencia/ia.js
          node --check src/modules/inteligencia/integrada.js
          node tests/laboratorio_acceso_v2.cjs
          node tests/laboratorio_resultados_v1.cjs
          node tests/portfolio_home_v2.cjs
          node tests/initiative_lifecycle_v2.cjs
          node tests/home_rdaim_v2.cjs
          node --check src/modules/encuestas/encuestas.js
          node --check src/modules/encuestas/motor.js
          node --check src/modules/encuestas/programacion.js
          node --check src/modules/encuestas/responder.js
          node tests/ee_application_windows_v2.cjs
          node tests/ee_comments_progressive_v1.cjs
          node --check src/modules/encuestas/encadenamiento.js
          node --check src/modules/encuestas/comparacion-vinculada.js
          node tests/ee_linked_surveys_v1.cjs
          node --check src/modules/resultados/diagnostico.js
          node tests/ee_v2_compact_selector.cjs
          node tests/ee_delete_v2.cjs
          node --check src/modules/encuestas/priorizacion.js
          node --check src/modules/encuestas/responder.js
          node tests/priority_instrument_v2.cjs
          node tests/priority_ui_v2.cjs
          node tests/diagnostico_nav_v2.cjs
          node --check src/modules/analisis/capacidad-adaptativa.js
          node --check src/modules/analisis/capacidad-adaptativa-lectura.js
          node --check src/modules/analisis/capacidad-adaptativa-simulacion-ui.js
          node tests/capacidad_adaptativa_dinamica_v1.cjs
          node tests/capacidad_adaptativa_conteos_v2.cjs

      - name: Preparar sitio publico
        run: |
          set -e
          mkdir -p _site
          cp index.html responder.html _site/
          cp -R assets src admin _site/
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
          name: github-pages-${{ github.run_attempt }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

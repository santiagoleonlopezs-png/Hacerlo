name: HACERLO - Publicacion controlada

on:
  push:
    branches:
      - hacerlo-v2-modular
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  deployments: read
  id-token: write

# Evitar publicaciones simultaneas: una activa y la siguiente pendiente.
concurrency:
  group: hacerlo-pages-produccion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          set -e
          test -f index.html
          test -f responder.html
          test -f src/core/app.js
          test -f src/modules/encuestas/encuestas.js
          node --check src/core/app.js
          node --check src/modules/encuestas/encuestas.js

      - name: Consultar estado de Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo "CONFIGURACION_PAGES"
          gh api "repos/${GH_REPO}/pages" --jq '{status,build_type,source,html_url}' || true
          echo "DESPLIEGUE_BLOQUEANTE"
          gh api "repos/${GH_REPO}/pages/deployments/120fd613bb6255ada15547cbeee75e523c320951" --jq '{status,created_at,updated_at}' || true
          echo "REGISTROS_DESPLIEGUE"
          gh api "repos/${GH_REPO}/deployments?sha=120fd613bb6255ada15547cbeee75e523c320951&per_page=100" --jq '.[] | {id,sha,environment,created_at,updated_at,transient_environment,production_environment}' || true
          for id in $(gh api "repos/${GH_REPO}/deployments?sha=120fd613bb6255ada15547cbeee75e523c320951&per_page=100" --jq '.[].id' 2>/dev/null); do
            echo "ESTADOS_DESPLIEGUE_${id}"
            gh api "repos/${GH_REPO}/deployments/${id}/statuses?per_page=10" --jq '.[0:5] | map({state,description,created_at})' || true
          done

      - name: Preparar sitio publico
        run: |
          set -e
          mkdir -p _site
          cp index.html responder.html _site/
          cp -R assets src _site/
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
          name: github-pages-${{ github.run_attempt }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

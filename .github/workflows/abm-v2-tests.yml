name: HACERLO V2 - Motor científico ABM
on:
  push:
    branches:
      - feature/v2-motor-agentes-cientifico
  pull_request:
    branches:
      - hacerlo-v2-modular

jobs:
  verificar-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias Python
        run: pip install -r backend/requirements.txt httpx2
      - name: Sintaxis backend y módulos cargados
        run: |
          python -m compileall -q backend
          node --check src/core/app.js
          node --check src/modules/analisis/agentes-evidencia-v2.js
          node --check src/modules/analisis/agentes-abm.js
          node --check src/modules/analisis/agentes-calibracion.js
      - name: Suite científica y API con autenticación simulada
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Prueba de render ABM V2
        run: node tests/abm_v2_frontend.cjs
      - name: Agregación de evidencias observadas V2
        run: node tests/abm_v2_evidence.cjs
      - name: Flujo V2 con simulación y Supabase simulada
        run: node tests/abm_v2_integration.cjs
      - name: Verificar carga sin reemplazar módulos de V2
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app = Path('src/core/app.js').read_text(encoding='utf-8')
          assert 'src/modules/analisis/agentes-evidencia-v2.js' in html
          assert 'src/modules/analisis/agentes-abm.js' in html
          assert 'src/modules/analisis/agentes-calibracion.js' in html
          assert 'src/modules/encuestas/encuestas.js' in html
          assert 'src/modules/diseno/audiencias.js' in html
          assert "a.innerHTML=head+renderAgentSimulationPage(x);return" in app
          assert 'src/modules/analisis/simulacion.js' not in html, 'Archivo antiguo incompleto: no debe cargarse'
          PY

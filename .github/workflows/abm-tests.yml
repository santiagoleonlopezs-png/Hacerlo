name: Verificar motor de agentes
on:
  pull_request:
  push:
    branches:
      - feature/abm-adopcion-v1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de ejecución y pruebas
        run: pip install -r backend/requirements.txt httpx
      - name: Comprobar sintaxis del motor
        run: python -m compileall -q backend
      - name: Verificar rutas del backend
        run: PYTHONPATH=backend python -c "from app import app; assert any(r.path == '/api/simulation/adoption' for r in app.routes)"
      - name: Probar simulaciones
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Comprobar sintaxis del laboratorio web
        run: node --check simulacion-agentes.js
      - name: Comprobar sintaxis de calibración web
        run: node --check calibracion-agentes.js
      - name: Probar integración de laboratorio web
        run: node tests/abm_frontend.cjs
      - name: Probar flujo completo con iniciativa y Supabase simulada
        run: node tests/abm_integration.cjs
      - name: Comprobar rutas de calibración y sensibilidad
        run: PYTHONPATH=backend python -c "from app import app; assert {'/api/simulation/calibrate', '/api/simulation/sensitivity'} <= {r.path for r in app.routes}"
